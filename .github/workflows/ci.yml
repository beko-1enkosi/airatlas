name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check linting
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest

      - name: Parse dbt project (no database required)
        env:
          AIRATLAS_DB_HOST: localhost
          AIRATLAS_DB_PORT: "5432"
          AIRATLAS_DB_NAME: airatlas
          AIRATLAS_DB_USER: parse_only
          AIRATLAS_DB_PASSWORD: unused_placeholder
          AIRATLAS_DBT_SCHEMA: airatlas_analytics
          DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
        run: dbt parse --project-dir dbt --profiles-dir dbt
