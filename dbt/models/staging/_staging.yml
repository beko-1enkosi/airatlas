version: 2

models:
  - name: stg_locations
    description: "Thin view of warehouse location identity and nullable coordinate metadata."
    columns:
      - name: location_id
        description: "Stable OpenAQ monitoring-location identifier; names are not observation identity."
        data_tests:
          - not_null
          - unique
      - name: location_name
        description: "Source location name retained by the warehouse; may be null."
      - name: latitude
        description: "Available source latitude in decimal degrees; a missing coordinate stays null."
      - name: longitude
        description: "Available source longitude in decimal degrees; a missing coordinate stays null."
      - name: weather_latitude
        description: "Latitude used for the historical weather lookup, when weather matched."
      - name: weather_longitude
        description: "Longitude used for the historical weather lookup, when weather matched."
  - name: stg_observations
    description: "One warehouse observation per natural key, with source units, timestamp types, provenance and weather nulls unchanged."
    columns:
      - name: location_id
        description: "Stable OpenAQ monitoring-location identifier; names are not observation identity."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: "ref('stg_locations')"
                field: location_id
      - name: location_name
        description: "Source location name retained by the warehouse; may be null."
      - name: sensor_id
        description: "Stable OpenAQ sensor identifier associated with this pollutant observation."
        data_tests:
          - not_null
      - name: parameter
        description: "OpenAQ pollutant code, pm25 or pm10; keep pollutants separate in analysis."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["pm25", "pm10"]
      - name: parameter_id
        description: "Optional OpenAQ parameter identifier from source measurement metadata."
      - name: unit
        description: "Unconverted source concentration unit; later aggregations must group by pollutant and unit."
        data_tests:
          - not_null
      - name: value
        description: "Air-quality concentration reported by OpenAQ for the observation period; finite negative values are retained."
        data_tests:
          - not_null
      - name: period_label
        description: "Source label describing the measurement period, where supplied."
      - name: period_interval
        description: "Source interval text, retained without assuming all observations have equal duration."
      - name: datetime_from_utc
        description: "Timezone-aware start of the OpenAQ measurement period."
        data_tests:
          - not_null
      - name: datetime_to_utc
        description: "Timezone-aware end of the period; basis for UTC date and weather-hour alignment."
        data_tests:
          - not_null
      - name: datetime_from_local
        description: "Optional original local period-start text, without timezone reinterpretation."
      - name: datetime_to_local
        description: "Optional original local period-end text, without timezone reinterpretation."
      - name: measurement_date_utc
        description: "UTC calendar date of the measurement-period end, stored as a PostgreSQL date."
        data_tests:
          - not_null
      - name: latitude
        description: "Available source latitude in decimal degrees; a missing coordinate stays null."
      - name: longitude
        description: "Available source longitude in decimal degrees; a missing coordinate stays null."
      - name: source
        description: "Air-quality source identifier, currently openaq."
        data_tests:
          - not_null
      - name: source_file
        description: "Relative raw batch path retained for investigation of the source observation."
      - name: retrieval_datetime_from
        description: "Requested source retrieval lower boundary, preserved as date or timestamp text."
      - name: retrieval_datetime_to
        description: "Requested source retrieval upper boundary, preserved as date or timestamp text."
      - name: weather_hour_utc
        description: "UTC measurement-period end floored to an hour for exact location/hour weather matching."
      - name: temperature_2m_c
        description: "Historical 2-metre temperature in Celsius; unavailable values remain null."
      - name: relative_humidity_2m_pct
        description: "Historical 2-metre relative humidity in percent; unavailable values remain null."
      - name: precipitation_mm
        description: "Historical hourly precipitation in millimetres; null does not mean zero."
      - name: wind_speed_10m_kmh
        description: "Historical 10-metre wind speed in kilometres per hour; unavailable values remain null."
      - name: weather_source
        description: "Matched weather source, currently open_meteo; null indicates no usable weather context."
      - name: weather_latitude
        description: "Latitude used for the historical weather lookup, when weather matched."
      - name: weather_longitude
        description: "Longitude used for the historical weather lookup, when weather matched."
