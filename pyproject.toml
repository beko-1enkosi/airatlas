[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "airatlas"
version = "0.1.0"
description = "A Data Engineering portfolio project for a public air-quality data platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pandas>=2.2.3,<4"]

[project.optional-dependencies]
dev = [
    "ruff>=0.9,<1",
    "pytest>=8,<10",
]

[project.urls]
Repository = "https://github.com/beko-1enkosi/airatlas"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # Core Python style and error checks
    "F",               # Pyflakes: unused imports, undefined names, etc.
    "I",               # Import sorting
    "UP",              # Modern Python syntax
    "B",               # Common bug patterns
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
